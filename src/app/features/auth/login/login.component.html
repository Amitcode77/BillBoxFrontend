<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="card p-4 shadow login-card">
    <h2 class="text-center mb-4">Login</h2>
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input
        id="username"
        type="text"
        class="form-control form-control-lg"
        formControlName="username"
        [class.is-invalid]="isUsernameInvalid"
        autocomplete="username"
        required
      />
      <div class="invalid-feedback" *ngIf="usernameError">
        {{ usernameError }}
      </div>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        id="password"
        type="password"
        class="form-control form-control-lg"
        formControlName="password"
        [class.is-invalid]="isPasswordInvalid"
        autocomplete="current-password"
        required
      />
      <div class="invalid-feedback" *ngIf="passwordError">
        {{ passwordError }}
      </div>
    </div>
    <div *ngIf="error" class="alert alert-danger py-2 text-center">{{ error }}</div>
    <button
      type="submit"
      class="btn btn-primary btn-lg w-100"
      [disabled]="loginForm.invalid"
    >
      Login
    </button>
  </div>
</form>
