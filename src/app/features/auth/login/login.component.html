<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="card p-4 shadow login-card">
    <h2 class="text-center mb-4">Login</h2>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input
        id="email"
        type="email"
        class="form-control form-control-lg"
        formControlName="email"
        [class.is-invalid]="isEmailInvalid"
        autocomplete="email"
        required
        placeholder="Enter your email"
      />
      <div class="invalid-feedback" *ngIf="emailError">
        {{ emailError }}
      </div>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        id="password"
        type="password"
        class="form-control form-control-lg"
        formControlName="password"
        [class.is-invalid]="isPasswordInvalid"
        autocomplete="current-password"
        required
        placeholder="Enter your password"
      />
      <div class="invalid-feedback" *ngIf="passwordError">
        {{ passwordError }}
      </div>
    </div>
    <div *ngIf="error" class="alert alert-danger py-2 text-center">{{ error }}</div>
    <button
      type="submit"
      class="btn btn-primary btn-lg w-100"
      [disabled]="loginForm.invalid || loading"
    >
      <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>
  </div>
</form>
