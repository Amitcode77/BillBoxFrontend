<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card shadow p-4">
        <h3 class="mb-2 text-center">Stock Update (Refill)</h3>
        <p class="text-center text-muted mb-4">Update product stock by adding new quantities. Enter the amount to add for each product and click Save.</p>
        <form [formGroup]="stockForm" (ngSubmit)="onSubmit()">
          <div *ngIf="items.controls.length > 0; else noProducts">
            <div class="table-responsive">
              <table class="table table-bordered align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Name</th>
                    <th>Initial Quantity</th>
                    <th>New Quantity to Add</th>
                    <th>Updated Quantity</th>
                  </tr>
                </thead>
                <tbody formArrayName="items">
                  <tr *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                    <td>
                      <input type="text" class="form-control" formControlName="name" readonly tabindex="-1" />
                    </td>
                    <td>
                      <input type="number" class="form-control" formControlName="initialQuantity" readonly tabindex="-1" />
                    </td>
                    <td>
                      <input type="number" class="form-control" formControlName="addQuantity" min="0"
                        (input)="onAddQuantityChange(i)" placeholder="0" />
                      <div class="invalid-feedback d-block" *ngIf="item.get('addQuantity')?.touched && item.get('addQuantity')?.invalid">
                        <span *ngIf="item.get('addQuantity')?.errors?.['required']">Required</span>
                        <span *ngIf="item.get('addQuantity')?.errors?.['min']">Must be 0 or more</span>
                      </div>
                    </td>
                    <td>
                      <input type="number" class="form-control" formControlName="updatedQuantity" readonly tabindex="-1" />
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="text-end mt-4">
              <button type="submit" class="btn btn-primary px-4" [disabled]="stockForm.invalid">Save</button>
            </div>
          </div>
          <ng-template #noProducts>
            <div class="alert alert-info text-center my-4">
              No products available for stock update.
            </div>
          </ng-template>
        </form>
      </div>
    </div>
  </div>
</div>
