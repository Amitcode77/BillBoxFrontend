<div class="container py-4">
  <div class="row mb-3">
    <div class="col-md-6">
      <h3>Invoice History</h3>
    </div>
    <div class="col-md-6 text-end">
      <button class="btn btn-success" routerLink="/sales/new">
        <i class="bi bi-plus-lg"></i> New Invoice
      </button>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Invoice ID</th>
          <th>Date</th>
          <th>Items</th>
          <th>Total</th>
          <th style="width: 120px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let invoice of invoices">
          <td>{{ invoice.id }}</td>
          <td>{{ invoice.date | date: 'medium' }}</td>
          <td>
            <ul class="mb-0 ps-3">
              <li *ngFor="let item of invoice.items">
                {{ item.name }} (x{{ item.quantity }})
              </li>
            </ul>
          </td>
          <td>{{ invoice.total | currency }}</td>
          <td>
            <button class="btn btn-sm btn-primary me-2" [routerLink]="['/sales', invoice.id]">View</button>
            <button class="btn btn-sm btn-secondary" (click)="openPrintInvoice(invoice)">Print</button>
          </td>
        </tr>
        <tr *ngIf="invoices.length === 0">
          <td colspan="5" class="text-center">No invoices found.</td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- Print Invoice Modal -->
  <div class="modal fade show d-block" tabindex="-1" *ngIf="showPrintInvoice && selectedInvoice" style="background:rgba(0,0,0,0.4);">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body p-0">
          <app-print-invoice
            [invoice]="selectedInvoice"
            (close)="closePrintInvoice()"
          ></app-print-invoice>
        </div>
      </div>
    </div>
  </div>
</div>
