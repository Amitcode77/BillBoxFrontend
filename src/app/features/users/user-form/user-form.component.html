<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card p-4 shadow">
        <h3 class="mb-4 text-center">{{ isEditMode ? 'Edit User' : 'Add User' }}</h3>
        <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control form-control-lg" formControlName="email" />
            <div class="invalid-feedback d-block" *ngIf="f['email'].touched && f['email'].invalid">
              <span *ngIf="f['email'].errors?.['required']">Email is required</span>
              <span *ngIf="f['email'].errors?.['email']">Please enter a valid email address</span>
            </div>
          </div>
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input id="fullName" type="text" class="form-control form-control-lg" formControlName="fullName" />
            <div class="invalid-feedback d-block" *ngIf="f['fullName'].touched && f['fullName'].invalid">
              Full name is required
            </div>
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input id="phone" type="text" class="form-control form-control-lg" formControlName="phone" placeholder="+1234567890" />
            <div class="invalid-feedback d-block" *ngIf="f['phone'].touched && f['phone'].invalid">
              <span *ngIf="f['phone'].errors?.['required']">Phone number is required</span>
              <span *ngIf="f['phone'].errors?.['pattern']">Please enter a valid phone number</span>
            </div>
          </div>
          <div class="mb-3" *ngIf="!isEditMode">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" class="form-control form-control-lg" formControlName="password" />
            <div class="invalid-feedback d-block" *ngIf="f['password'].touched && f['password'].invalid">
              <span *ngIf="f['password'].errors?.['required']">Password is required</span>
              <span *ngIf="f['password'].errors?.['minlength']">Password must be at least 8 characters</span>
            </div>
          </div>
          <div class="mb-3">
            <label for="role" class="form-label">Role</label>
            <select id="role" class="form-select form-select-lg" formControlName="role">
              <option value="" disabled>Select role</option>
              <option value="admin">Admin</option>
              <option value="manager">Manager</option>
              <option value="staff">Staff</option>
            </select>
            <div class="invalid-feedback d-block" *ngIf="f['role'].touched && f['role'].invalid">
              Role is required
            </div>
          </div>
          <div *ngIf="error" class="alert alert-danger text-center">{{ error }}</div>
          <div class="d-flex justify-content-between mt-4">
            <button type="button" class="btn btn-outline-secondary" routerLink="/users" [disabled]="loading">Cancel</button>
            <button type="submit" class="btn btn-primary px-4" [disabled]="userForm.invalid || loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              {{ isEditMode ? 'Update' : 'Add' }} User
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
