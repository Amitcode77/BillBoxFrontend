<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card p-4 shadow">
        <h3 class="mb-4 text-center">{{ isEditMode ? 'Edit User' : 'Add User' }}</h3>
        <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input id="name" type="text" class="form-control form-control-lg" formControlName="name" />
            <div class="invalid-feedback d-block" *ngIf="f['name'].touched && f['name'].invalid">
              Name is required
            </div>
          </div>
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input id="username" type="text" class="form-control form-control-lg" formControlName="username" />
            <div class="invalid-feedback d-block" *ngIf="f['username'].touched && f['username'].invalid">
              Username is required
            </div>
          </div>
          <div class="mb-3">
            <label for="phone_number" class="form-label">Phone Number</label>
            <input id="phone_number" type="text" class="form-control form-control-lg" formControlName="phone_number" placeholder="123-456-7890" />
            <div class="invalid-feedback d-block" *ngIf="f['phone_number'].touched && f['phone_number'].invalid">
              <span *ngIf="f['phone_number'].errors?.['required']">Phone number is required</span>
              <span *ngIf="f['phone_number'].errors?.['pattern']">Format: 123-456-7890</span>
            </div>
          </div>
          <div class="mb-3">
            <label for="role_type" class="form-label">Role</label>
            <select id="role_type" class="form-select form-select-lg" formControlName="role_type">
              <option value="" disabled>Select role</option>
              <option value="admin">Admin</option>
              <option value="user">User</option>
              <option value="manager">Manager</option>
            </select>
            <div class="invalid-feedback d-block" *ngIf="f['role_type'].touched && f['role_type'].invalid">
              Role is required
            </div>
          </div>
          <div class="mb-3 form-check form-switch">
            <input id="isActive" type="checkbox" class="form-check-input" formControlName="isActive" />
            <label for="isActive" class="form-check-label">Active</label>
          </div>
          <div *ngIf="error" class="alert alert-danger text-center">{{ error }}</div>
          <div class="d-flex justify-content-between mt-4">
            <button type="button" class="btn btn-outline-secondary" routerLink="/users">Cancel</button>
            <button type="submit" class="btn btn-primary px-4" [disabled]="userForm.invalid">
              {{ isEditMode ? 'Update' : 'Add' }} User
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
