<div class="container py-4">
  <div class="row mb-3">
    <div class="col-md-6">
      <input
        type="text"
        class="form-control"
        placeholder="Search users..."
        [value]="searchTerm"
        (input)="onSearchInput($event)"
      />
    </div>
    <div class="col-md-6 text-end">
      <button class="btn btn-success" routerLink="/users/new">
        <i class="bi bi-plus-lg"></i> Add User
      </button>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Username</th>
          <th>Phone</th>
          <th>Role</th>
          <th>Status</th>
          <th style="width: 120px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td>{{ user.name }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.phone_number }}</td>
          <td>{{ user.role_type }}</td>
          <td>
            <span class="badge" [ngClass]="user.isActive ? 'bg-success' : 'bg-secondary'">
              {{ user.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td>
            <button class="btn btn-sm btn-primary me-2" [routerLink]="['/users', user.id]">View</button>
            <button class="btn btn-sm btn-secondary" [routerLink]="['/users', user.id, 'edit']">Edit</button>
          </td>
        </tr>
        <tr *ngIf="filteredUsers.length === 0">
          <td colspan="6" class="text-center">No users found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
