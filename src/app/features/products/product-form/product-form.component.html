<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card p-4 shadow">
        <h3 class="mb-4 text-center">{{ isEditMode ? 'Edit Product' : 'Add Product' }}</h3>
        <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input id="name" type="text" class="form-control form-control-lg" formControlName="name" />
            <div class="invalid-feedback d-block" *ngIf="f['name'].touched && f['name'].invalid">
              Name is required
            </div>
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" class="form-control form-control-lg" formControlName="description" rows="2"></textarea>
            <div class="invalid-feedback d-block" *ngIf="f['description'].touched && f['description'].invalid">
              Description is required
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="mfdDate" class="form-label">Mfd Date</label>
              <input id="mfdDate" type="date" class="form-control form-control-lg" formControlName="mfdDate" />
              <div class="invalid-feedback d-block" *ngIf="f['mfdDate'].touched && f['mfdDate'].invalid">
                Mfd Date is required
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="expiryDate" class="form-label">Expiry Date</label>
              <input id="expiryDate" type="date" class="form-control form-control-lg" formControlName="expiryDate" />
              <div class="invalid-feedback d-block" *ngIf="f['expiryDate'].touched && f['expiryDate'].invalid">
                Expiry Date is required
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input id="price" type="number" class="form-control form-control-lg" formControlName="price" min="0" />
            <div class="invalid-feedback d-block" *ngIf="f['price'].touched && f['price'].invalid">
              <span *ngIf="f['price'].errors?.['required']">Price is required</span>
              <span *ngIf="f['price'].errors?.['min']">Price must be at least 0</span>
            </div>
          </div>
          <div *ngIf="error" class="alert alert-danger text-center">{{ error }}</div>
          <div class="d-flex justify-content-between mt-4">
            <button type="button" class="btn btn-outline-secondary" routerLink="/products">Cancel</button>
            <button type="submit" class="btn btn-primary px-4" [disabled]="productForm.invalid">
              {{ isEditMode ? 'Update' : 'Add' }} Product
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
